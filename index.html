<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contas da Casa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one column ledger, ~720px; sticky tab bar; each month is a list of bills sorted by due day */
:root{
  --bg:#f4f6f3; --surface:#ffffff; --sunk:#eaeeea; --fg:#1b2220; --muted:#62706b; --line:#d9dfdb;
  --accent:#0e6b5c; --accent-soft:#d8ece7; --on-accent:#ffffff;
  --ok:#1d7f47; --ok-soft:#dcf0e3; --late:#bf3b28; --late-soft:#f8e1dc; --soon:#9a6512; --soon-soft:#f6ead2;
  --bra:#2f66cc; --nub:#8137e6; --mar:#c99400;
  --bra-s:#2b8ae0; --bra-ink:#ffffff; --nub-s:#6a22c4; --nub-ink:#ffffff; --mar-s:#d49b0b; --mar-ink:#241a00; --ok-ink:#ffffff; --tint:16%; --none:#a3ada8;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --f-display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#191f1c; --sunk:#222a26; --fg:#e6ece9; --muted:#93a19a; --line:#2b3530;
  --accent:#4dc2a6; --accent-soft:#17332c; --on-accent:#0b1f1a;
  --ok:#5fcb8d; --ok-soft:#173022; --late:#ff8270; --late-soft:#3a1d18; --soon:#e9b354; --soon-soft:#352a14;
  --bra:#6c9bf2; --nub:#b18cff; --mar:#f0c33c;
  --bra-s:#3b92dc; --bra-ink:#ffffff; --nub-s:#8c55e8; --nub-ink:#ffffff; --mar-s:#b8890f; --mar-ink:#1d1500; --ok-ink:#0b1f14; --tint:24%; --none:#55625c;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#191f1c; --sunk:#222a26; --fg:#e6ece9; --muted:#93a19a; --line:#2b3530;
  --accent:#4dc2a6; --accent-soft:#17332c; --on-accent:#0b1f1a;
  --ok:#5fcb8d; --ok-soft:#173022; --late:#ff8270; --late-soft:#3a1d18; --soon:#e9b354; --soon-soft:#352a14;
  --bra:#6c9bf2; --nub:#b18cff; --mar:#f0c33c;
  --bra-s:#3b92dc; --bra-ink:#ffffff; --nub-s:#8c55e8; --nub-ink:#ffffff; --mar-s:#b8890f; --mar-ink:#1d1500; --ok-ink:#0b1f14; --tint:24%; --none:#55625c;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;letter-spacing:-.01em}
.sync{font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:1 1 auto;text-align:center;padding:7px 6px;white-space:nowrap;border-radius:7px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
nav.tabs a[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
h2{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0;text-wrap:balance}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.mbwrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,104px));z-index:4;background:var(--bg);margin:-18px 0 14px;padding-block:10px 8px}
.mbwrap.stuck{border-bottom:1px solid var(--line);box-shadow:0 6px 10px -8px rgb(0 0 0 / .25)}
.mbwrap .navpick{margin:8px 0 0}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthbar h2{font-size:24px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px}
.today{font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;margin-bottom:18px}
.summary .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:440px){.summary .row{grid-template-columns:1fr 1fr}.summary .row>:first-child{grid-column:1/-1}}
.summary .big{font-family:var(--f-num);font-weight:600;font-size:19px;font-variant-numeric:tabular-nums}
.summary .big.falta{color:var(--late)}
.summary .big.pago{color:var(--ok)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.alerts{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.soon{background:var(--soon-soft);color:var(--soon)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.c-B{background:var(--bra-s)} .c-N{background:var(--nub-s)} .c-M{background:var(--mar-s)} .c-{background:var(--line)}
ul.bills{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.bill{--cc:var(--line);--ci:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:background-color .2s,border-color .2s,color .2s}
.bill.cB{--cc:var(--bra-s);--ci:var(--bra-ink)}
.bill.cN{--cc:var(--nub-s);--ci:var(--nub-ink)}
.bill.cM{--cc:var(--mar-s);--ci:var(--mar-ink)}
.bill.c0{--cc:var(--ok);--ci:var(--ok-ink)}
.bill.has-c{background:color-mix(in srgb,var(--cc) var(--tint),var(--surface));border-color:color-mix(in srgb,var(--cc) 40%,var(--surface))}
.bill.has-c .day{background:color-mix(in srgb,var(--cc) 26%,var(--surface))}
.bill.is-pg{background:var(--cc);border-color:var(--cc);color:var(--ci)}
.bill.is-pg .day{background:color-mix(in srgb,var(--ci) 16%,transparent);color:var(--ci)}
.bill.is-pg .sub{color:var(--ci);opacity:.85}
.bill.is-n{opacity:.55}
.bill-main{display:grid;grid-template-columns:44px 1fr auto auto;align-items:center;gap:10px;padding:10px 10px 10px 8px;width:100%;background:none;border:0;text-align:left}
.day{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--sunk);font-family:var(--f-num);font-weight:600;font-size:15px}
.bill.late .day{background:var(--late-soft);color:var(--late)}
.bill.soon .day{background:var(--soon-soft);color:var(--soon)}
.bill .nome{font-weight:600;min-width:0;overflow-wrap:anywhere}
.bill .sub{font-size:12px;color:var(--muted)}
.bill .sub.late{color:var(--late);font-weight:600}
.bill .sub.soon{color:var(--soon);font-weight:600}
.bill .valor{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.check{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;font-weight:700;flex:none}
.bill.has-c .check:not(.pg){border-color:color-mix(in srgb,var(--cc) 55%,var(--surface))}
.check.pg{background:var(--ok);border-color:color-mix(in srgb,var(--ci) 75%,transparent);color:var(--ok-ink)}
.check.n{background:var(--sunk);color:var(--muted);font-size:12px}
.picker{grid-column:3/5;display:flex;gap:8px;align-items:center;justify-content:flex-end}
.ball{width:38px;height:38px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;animation:pop .18s ease-out both}
.ball:nth-child(2){animation-delay:.03s}.ball:nth-child(3){animation-delay:.06s}.ball:nth-child(4){animation-delay:.09s}
.ball.bB{background:var(--bra-s);color:var(--bra-ink)}
.ball.bN{background:var(--nub-s);color:var(--nub-ink)}
.ball.bM{background:var(--mar-s);color:var(--mar-ink)}
.ball.undo{background:var(--sunk);color:var(--muted);font-size:17px}
@keyframes pop{from{transform:scale(.55);opacity:.5}to{transform:none;opacity:1}}
@media (max-width:400px){.ball{width:34px;height:34px}.picker{gap:6px}}
.edit{border-top:1px solid var(--line);padding:12px;display:grid;gap:10px;background:var(--bg);color:var(--fg)}
.listbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.newform{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;margin-bottom:14px}
.nf-grid{display:grid;grid-template-columns:1fr 76px 130px;gap:8px}
.nf-grid input,.nf-grid select{width:100%}
@media (max-width:480px){.nf-grid{grid-template-columns:1fr 1fr}.nf-grid .nf-nome{grid-column:1/-1}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;background:var(--surface);cursor:pointer}
.chip input:checked+span{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg);font-weight:600}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.nf-err{margin:0;color:var(--late);font-size:13px;font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.field{display:grid;gap:4px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:24px;text-align:center;display:grid;gap:12px;justify-items:center}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:var(--late);color:var(--surface)}
.btn.small{padding:6px 12px;font-size:13px}
.section{display:grid;gap:12px;margin-bottom:24px}
.yearbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.fxgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:480px){.fxgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
.fxtile{--tc:var(--line);display:flex;flex-direction:column;gap:6px;text-align:left;min-height:118px;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--line);border-top:4px solid var(--tc);background:var(--surface);color:var(--fg)}
.fxtile:hover{border-color:color-mix(in srgb,var(--tc) 55%,var(--line));background:color-mix(in srgb,var(--tc) 6%,var(--surface))}
.fxtile.tB{--tc:var(--bra-s)}.fxtile.tN{--tc:var(--nub-s)}.fxtile.tM{--tc:var(--mar-s)}
.fxt-top{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted);font-weight:600;flex-wrap:wrap}
.fxt-conta{display:inline-flex;align-items:center;gap:4px}
.fxt-conta .dot{margin-right:0}
.fxt-nome{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:anywhere;flex:1}
.fxt-bot{display:grid;gap:1px}
.fxt-bot b{font-size:16px}
.fxt-aj{font-size:11px;color:var(--ok);font-weight:600}
.fixrow{grid-column:1/-1;background:var(--surface);border:1px solid var(--accent);box-shadow:0 0 0 3px var(--accent-soft);border-radius:12px;padding:12px;display:grid;grid-template-columns:64px 1fr 120px;gap:8px;align-items:end}
.fxr-head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fixrow .more select{width:auto;flex:0 1 auto}
.fixrow .wide{grid-column:2/3}
.fixrow .more{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fixrow label{font-size:11px;color:var(--muted);display:grid;gap:3px}
.fixrow input,.fixrow select{width:100%}
@media (max-width:480px){.fixrow{grid-template-columns:60px 1fr}.fixrow .val{grid-column:1/-1}}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:520px;height:auto}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:11px}
.chart .v{fill:var(--fg);font-weight:600}
.notes-list{display:grid;gap:8px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:52px 1fr;gap:10px;font-size:14px}
.note b{font-family:var(--f-num)}
.note p{margin:0;white-space:pre-line}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.goal .big{font-family:var(--f-num);font-size:28px;font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:480px){.grid3{grid-template-columns:1fr 1fr}}
.reg{display:grid;grid-template-columns:90px 110px 1fr 32px;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
@media (max-width:480px){.reg{grid-template-columns:80px 1fr 32px}.reg .rn{grid-column:1/-1;order:5}}
.x{border:0;background:none;color:var(--muted);font-size:18px}
.msg{padding:12px 14px;border-radius:10px;background:var(--soon-soft);color:var(--soon);font-size:14px;margin-bottom:14px}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px}
textarea{width:100%;min-height:90px;resize:vertical}
.muted{color:var(--muted)}
.sumfoot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.reschip{margin-left:auto;display:grid;justify-items:end;gap:1px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;text-align:right}
.reschip .rv{font-family:var(--f-num);font-weight:600;font-size:15px;white-space:nowrap}
.reschip .rv i{font-style:normal;color:var(--muted);margin-inline:4px}
.reschip .rl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.resedit{display:flex;gap:8px;flex-wrap:wrap;align-items:end;justify-content:flex-end;width:100%}
.resedit label{display:grid;gap:3px;font-size:11px;color:var(--muted)}
.resedit input{width:120px}
.statbar{margin-bottom:14px}
.h3{font-size:17px}
.sep{font-size:20px;margin:30px 0 12px;padding-top:18px;border-top:1px solid var(--line)}
.small{font-size:13px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:22px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:3px;min-width:0}
.kv{font-size:18px;font-weight:600;overflow-wrap:anywhere}
.ks{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:640px){.grid2{grid-template-columns:1fr;gap:0}}
.hbars{display:grid;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr) 84px;gap:10px;align-items:center;font-size:14px;color:var(--fg)}
button.hbar{font:inherit;font-size:14px;text-align:left;background:none;border:0;padding:4px 6px;margin:-4px -6px;border-radius:8px;width:calc(100% + 12px)}
button.hbar:hover{background:var(--sunk)}
button.hbar.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.hb-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-track{height:12px;background:var(--sunk);border-radius:0 4px 4px 0;overflow:hidden}
.hb-track i{display:block;height:100%;border-radius:0 4px 4px 0}
.hb-val{white-space:nowrap;font-size:13px;font-weight:600;text-align:right}
.hb-val small{color:var(--muted);font-weight:400;font-size:11px;display:inline-block;min-width:32px}
.chg{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.chgrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:14px}
.det summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--accent);padding:4px 0}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:8px}
.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tbl.wrap td{white-space:normal}
.tbl.wrap td:last-child{text-align:right}
.tbl tr.tot td{border-bottom:0;font-weight:600}
.ctrls{display:flex;gap:10px;flex-wrap:wrap}
.ctrls .field{min-width:0;flex:1 1 200px}
.ctrls select{width:100%}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:0}
@media (max-width:640px){.kpis.k3{grid-template-columns:1fr 1fr}.kpis.k3 .kpi:first-child{grid-column:1/-1}}
.dashbox{display:inline-block;width:10px;height:10px;border:1.5px dashed var(--muted);border-radius:2px;margin-right:5px;vertical-align:-1px}
.dash{display:inline-block;width:14px;border-top:2px dashed var(--fg);vertical-align:3px;margin-right:5px}
.chart rect[data-tip]{cursor:pointer}
.chart rect[data-tip]:hover{fill:color-mix(in srgb,var(--fg) 6%,transparent)}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;line-height:1.4;padding:7px 9px;border-radius:8px;max-width:240px;white-space:pre-line;box-shadow:0 4px 14px rgb(0 0 0 / .18)}
.backup{display:grid;gap:10px}
.backup .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.okmsg{font-size:13px;color:var(--ok);font-weight:600;margin:0}

.fxm{grid-column:1/-1;display:grid;gap:8px;background:var(--bg);border-radius:10px;padding:10px;margin-top:4px}

@media (max-width:560px){.fxm-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:360px){.fxm-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

.fxm-cell.aj input{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 45%,var(--surface));color:var(--ok);font-weight:600}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Contas da Casa</h1><span class="sync" id="sync">Carregando…</span></div>
    <nav class="tabs">
      <a href="#mes" data-v="mes">Mês</a>
      <a href="#renda" data-v="renda">Renda</a>
      <a href="#fixas" data-v="fixas">Fixas</a>
      <a href="#cartoes" data-v="cartoes">Cartões</a>
      <a href="#reserva" data-v="reserva">Reserva</a>
      <a href="#estatisticas" data-v="estatisticas">Estatísticas</a>
    </nav>
  </header>
  <div id="msg"></div>
  <div class="tip" id="tip" role="tooltip" hidden></div>
  <main id="app">
    <div class="empty"><p class="muted">Carregando suas contas…</p></div>
  </main>
  <footer class="versao">v0.1.22</footer>
</div>

<script>
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES3=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const CONTAS={B:'Bradesco',N:'Nubank',M:'Mary'};
const K={pend:'pd',pago:'pg',nao:'n'};
const brl=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:(v%1?2:0)});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=new Date();
const S={anos:{},reserva:null,ano:now.getFullYear(),mes:now.getMonth(),fixAno:now.getFullYear(),open:null,db:null,loaded:false,readonly:false,confirmDel:null,fixMeses:null,fixOpen:null,cmpNome:'Plano de Saúde Bradesco',pick:null,navPick:null,adding:false,rendas:{},fontes:[],faturas:{},cartCfg:{regras:{}},obsEdit:null,cartPer:'mes',txMerch:null,txQ:'',catMgr:false,catErr:'',catDel:null,cartao:null,fatPaste:false,fatPrev:null,fatTxt:'',fatMsg:'',fatDel:false,txCat:null,rimp:null,dimp:null,rimpMsg:'',fonteEdit:null,addFonte:false,delEnt:null,statAno:now.getFullYear(),serieNome:'Nubank',serieN:20,resEdit:false,bkMsg:'',bkText:'',imp:null};
const app=document.getElementById('app');

/* ---------- writes: one in flight per document ---------- */
const pending={};
function save(path,getData){
  if(!S.db||S.readonly) return;
  const p=pending[path]||(pending[path]={busy:false,dirty:false});
  p.get=getData; p.dirty=true; setSync('Salvando…');
  if(!p.busy) flush(path);
}
async function flush(path){
  const p=pending[path]; p.busy=true;
  while(p.dirty){
    p.dirty=false;
    try{await S.db.doc(path).set(JSON.parse(JSON.stringify(p.get())))}
    catch(e){
      if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*700));p.dirty=true;continue}
      showMsg(e&&e.code==='invalid_argument'?'Só o dono pode alterar estes dados.':'Não consegui salvar a última mudança. Recarregue a página e tente de novo.');
      if(e&&e.code==='invalid_argument') S.readonly=true;
    }
  }
  p.busy=false;
  if(!Object.values(pending).some(x=>x.busy)) setSync('Salvo');
}
const saveAno=ano=>save('anos/'+ano,()=>S.anos[ano]);
const saveReserva=()=>save('config/reserva',()=>S.reserva);
function setSync(t){document.getElementById('sync').textContent=t}
function showMsg(t){document.getElementById('msg').innerHTML=t?`<div class="msg">${esc(t)}</div>`:''}

/* ---------- model helpers ---------- */
function st(item,m){const e=item.meses&&item.meses[m];return !e?'pend':e.s==='p'?'pago':e.s==='n'?'nao':'pend'}
function contaDe(item,m){const e=item.meses&&item.meses[m];if(e&&e.c==='-')return '';return (e&&e.c)||item.conta||''}
function setEntry(item,m,patch){
  item.meses=item.meses||Array(12).fill(null);
  let e=Object.assign({},item.meses[m]||{},patch);
  Object.keys(e).forEach(k=>{if(e[k]===''||e[k]==null)delete e[k]});
  if(e.c===item.conta) delete e.c;
  item.meses[m]=(!e.s&&!e.t&&!e.c&&e.v==null)?null:e;
}
const sortItens=a=>[...a].sort((x,y)=>(x.dia??99)-(y.dia??99)||x.nome.localeCompare(y.nome));
const anosOrdem=()=>Object.keys(S.anos).map(Number).sort((a,b)=>a-b);
const totalAno=d=>d.itens.reduce((s,i)=>s+(+i.valor||0),0);
function valorMes(i,m){const e=i.meses&&i.meses[m];return e&&e.v!=null?+e.v:(+i.valor||0)}
const temAjuste=(i,m)=>{const e=i.meses&&i.meses[m];return !!(e&&e.v!=null&&+e.v!==(+i.valor||0))};
const uid=()=>Math.random().toString(36).slice(2,10);

/* ---------- views ---------- */
function view(){let h=location.hash.slice(1);if(h==='historico')h='estatisticas';return ['mes','renda','fixas','cartoes','reserva','estatisticas'].includes(h)?h:'mes'}
function render(){
  const v=view();
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current',a.dataset.v===v?'page':'false'));
  if(!S.loaded){return}
  const f=document.getElementById('nf');
  const draft=f?{nome:f.elements['nf-nome'].value,dia:f.elements['nf-dia'].value,valor:f.elements['nf-valor'].value,mes:f.elements['nf-mes'].value,conta:(f.querySelector('input[name=nf-conta]:checked')||{}).value}:null;
  if(v==='mes') renderMes(); else if(v==='renda') renderRenda(); else if(v==='cartoes') renderCartoes(); else if(v==='fixas') renderFixas(); else if(v==='reserva') renderReserva(); else renderStats();
  const sc=document.getElementById('serie-chart'); if(sc) sc.scrollLeft=sc.scrollWidth;
  const g=document.getElementById('nf');
  if(g&&draft){g.elements['nf-nome'].value=draft.nome;g.elements['nf-dia'].value=draft.dia;g.elements['nf-valor'].value=draft.valor;g.elements['nf-mes'].value=draft.mes;
    const r=g.querySelector(`input[name=nf-conta][value="${draft.conta||''}"]`);if(r)r.checked=true}
}
const mkey=(a,m)=>`${a}-${String(m+1).padStart(2,'0')}`;
function resMes(ano,mes){
  const r=S.reserva||{},mm=r.meses||{},key=mkey(ano,mes);
  if(mm[key]) return {inicio:+mm[key].inicio||0,fim:+mm[key].fim||0,key,salvo:true};
  const d=new Date(ano,mes-1,1),pm=mm[mkey(d.getFullYear(),d.getMonth())];
  const inicio=pm?(+pm.fim||+pm.inicio||0):(+r.saldo||0);
  return {inicio,fim:inicio+(+r.aporte||0),key,salvo:false};
}
function resChip(ano,mes){
  const R=resMes(ano,mes);
  if(S.resEdit) return `<form class="resedit" id="resform" data-key="${R.key}">
    <label>Reserva no início do mês<input id="re-ini" class="num" type="number" inputmode="decimal" value="${R.inicio}"></label>
    <label>Meta para o fim do mês<input id="re-fim" class="num" type="number" inputmode="decimal" value="${R.fim}"></label>
    <button class="btn small" type="submit">Salvar</button><button class="btn ghost small" type="button" data-act="res-cancel">Cancelar</button></form>`;
  return `<button class="reschip" data-act="res-edit" title="Reserva no início de ${MESES[mes].toLowerCase()}: ${brl(R.inicio)}. Meta para o fim do mês: ${brl(R.fim)}. Toque para alterar.">
    <span class="rl">Reserva · início → meta</span><span class="rv">${k(R.inicio)}<i>→</i>${k(R.fim)}</span></button>`;
}
function newForm(ano,mesIni){
  const chips=[['B','Bradesco'],['N','Nubank'],['M','Mary'],['','Ainda não sei']].map(([k,l])=>`<label class="chip"><input type="radio" name="nf-conta" value="${k}" ${k===''?'checked':''}><span>${k?`<i class="dot c-${k}"></i>`:''}${l}</span></label>`).join('');
  return `<form class="newform" id="nf" data-ano="${ano}" novalidate>
    <h2 style="font-size:17px">Nova conta em ${ano}</h2>
    <div class="nf-grid">
      <label class="field nf-nome"><span class="label">Nome</span><input id="nf-nome" name="nf-nome" placeholder="Ex.: Academia" autocomplete="off"></label>
      <label class="field"><span class="label">Dia</span><input id="nf-dia" name="nf-dia" type="number" min="1" max="31" inputmode="numeric" placeholder="10"></label>
      <label class="field"><span class="label">Valor (R$)</span><input id="nf-valor" name="nf-valor" class="num" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0,00"></label>
    </div>
    <div class="field"><span class="label">Costuma pagar com</span><div class="chips">${chips}</div></div>
    <label class="field" style="max-width:220px"><span class="label">Começa a valer em</span>
      <select id="nf-mes" name="nf-mes">${MESES.map((m,k)=>`<option value="${k}" ${k===mesIni?'selected':''}>${m}</option>`).join('')}</select></label>
    <p class="muted" style="font-size:13px;margin:0">A conta entra nas fixas de ${ano} e aparece todo mês a partir do mês escolhido. Os meses anteriores ficam como "não se aplica".</p>
    <p class="nf-err" id="nf-err" hidden></p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="submit">Adicionar conta</button><button class="btn ghost" type="button" data-act="nf-close">Cancelar</button></div>
  </form>`;
}
function picker(i,s){
  return `<div class="picker" role="group" aria-label="De onde saiu o pagamento de ${esc(i.nome)}">
    ${['B','N','M'].map(k=>`<button class="ball b${k}" data-act="pay" data-id="${i.id}" data-v="${k}" aria-label="Pago com ${CONTAS[k]}" title="${CONTAS[k]}">${k}</button>`).join('')}
    ${s==='pago'?`<button class="ball undo" data-act="unpay" data-id="${i.id}" aria-label="Marcar como não pago" title="Desfazer pagamento">↺</button>`:''}</div>`;
}

/* ---------- renda ---------- */
const corFonte=f=>`var(--s${((+f.cor||0)%8)+1})`;
const diasNoMes=(a,m)=>new Date(a,m+1,0).getDate();
function rendaMes(ano,mes){const r=S.rendas[ano];return r?(r.entradas||[]).filter(e=>e.m===mes):[]}
const somaRenda=(ano,mes,f)=>rendaMes(ano,mes).filter(e=>!f||e.f===f).reduce((s,e)=>s+(+e.v||0),0);
function fixasMes(ano,mes){const d=S.anos[ano];if(!d)return 0;return d.itens.reduce((s,i)=>{const v=valorMes(i,mes);return s+(v>0&&st(i,mes)!=='nao'?v:0)},0)}
const saveRenda=ano=>save('rendas/'+ano,()=>S.rendas[ano]);
const saveFontes=()=>save('config/rendas',()=>({fontes:S.fontes}));
function monthBar(ano,mes){
  const isNow=ano===now.getFullYear()&&mes===now.getMonth();
  return `<div class="mbwrap"><div class="monthbar">
    <button class="iconbtn" data-act="prev" aria-label="Mês anterior">‹</button>
    <div style="text-align:center"><h2><button class="navbtn${S.navPick==='mes'?' on':''}" data-act="nav-mes" aria-expanded="${S.navPick==='mes'}" aria-label="Escolher mês">${MESES[mes]}</button> <button class="navbtn ano${S.navPick==='ano'?' on':''}" data-act="nav-ano" aria-expanded="${S.navPick==='ano'}" aria-label="Escolher ano">${ano}</button></h2>
    ${isNow?'':'<button class="today" data-act="hoje">Voltar para hoje</button>'}</div>

function rendaChart(pts,sel){
  const fs=S.fontes, n=pts.length, W=680,H=250,L=44,T=24,B=34,bw=(W-L-12)/n;
  const rows=pts.map(p=>{const r={t:somaRenda(p.y,p.m),fx:fixasMes(p.y,p.m)};fs.forEach(f=>r[f.id]=somaRenda(p.y,p.m,f.id));return r});
  const max=niceMax(Math.max(1,...rows.map(r=>Math.max(r.t,r.fx))));
  let g='';if(sel!=null)g+=`<rect x="${L+sel*bw}" y="${T-14}" width="${bw}" height="${H-T+14}" rx="6" fill="var(--accent-soft)"/>`;
  g+=axis(W,H,L,T,B,max,4);const Yv=v=>(H-B-T)*v/max;
  const used=fs.filter(f=>rows.some(r=>r[f.id]>0));
  rows.forEach((r,j)=>{const p=pts[j],x=L+j*bw+bw*.16,w=bw*.68;let y=H-B;const segs=used.filter(f=>r[f.id]>0);
    segs.forEach((f,si)=>{const h=Yv(r[f.id]),gap=si?2:0;y-=h;g+=`<rect x="${x}" y="${y+gap}" width="${w}" height="${Math.max(0,h-gap)}" rx="${si===segs.length-1?3:0}" fill="${corFonte(f)}"/>`});
    if(r.fx) g+=`<line x1="${x-3}" x2="${x+w+3}" y1="${H-B-Yv(r.fx)}" y2="${H-B-Yv(r.fx)}" stroke="var(--fg)" stroke-width="2" stroke-dasharray="4 3"/>`;
    g+=`<text x="${x+w/2}" y="${H-B+14}" text-anchor="middle"${j===sel?' class="v"':''}${n>12?' style="font-size:9.5px"':''}>${MES3[p.m]}</text>`;
    if(p.m===0||j===0) g+=`<text class="v" x="${x+w/2}" y="${H-B+28}" text-anchor="middle">${p.y}</text>`;
    if(r.t) g+=`<text class="v" x="${x+w/2}" y="${Math.min(y,H-B-Yv(r.fx))-6}" text-anchor="middle"${n>12?' style="font-size:9px"':''}>${k(r.t)}</text>`;
    const tip=[`${MESES[p.m]} de ${p.y}`,...segs.map(f=>`${f.nome}: ${brl(r[f.id])}`),`Entrou: ${brl(r.t)}`,`Contas fixas: ${brl(r.fx)}`,`${r.t-r.fx>=0?'Sobra':'Falta'}: ${brl(Math.abs(r.t-r.fx))}`].join('\n');

}

function diasChart(dias,F){
  const vA=F.vencAno??F.ano,vM=F.vencMes??F.mes,lim=new Date(vA,vM,(parseInt(F.venc)||10)-50),limK=`${lim.getFullYear()}-${String(lim.getMonth()+1).padStart(2,'0')}-${String(lim.getDate()).padStart(2,'0')}`;
  Object.keys(dias).forEach(k=>{if(k<limK)delete dias[k]});
  const ks=Object.keys(dias).sort();if(!ks.length)return '<p class="muted small">Sem compras dentro do período desta fatura.</p>';
  const d0=new Date(ks[0]+'T12:00'),d1=new Date(ks[ks.length-1]+'T12:00'),n=Math.round((d1-d0)/864e5)+1;
  const W=680,H=200,L=44,T=20,B=30,bw=(W-L-12)/n,vals=[];
  for(let j=0;j<n;j++){const d=new Date(d0.getTime()+j*864e5),key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;vals.push({d,key,v:dias[key]||0})}
  const max=niceMax(Math.max(1,...vals.map(x=>x.v)));let g=axis(W,H,L,T,B,max,4);
  vals.forEach((x,j)=>{const h=(H-B-T)*x.v/max,X=L+j*bw;if(x.v)g+=`<rect x="${X+bw*.12}" y="${H-B-h}" width="${Math.max(1,bw*.76)}" height="${h}" rx="2" fill="var(--accent)"/>`;
    if(x.d.getDate()===1||j===0||x.d.getDate()%7===1&&n>20||n<=20)g+=`<text x="${X+bw/2}" y="${H-B+14}" text-anchor="middle" style="font-size:9.5px">${x.d.getDate()}${x.d.getDate()===1||j===0?'/'+MES3[x.d.getMonth()].toLowerCase():''}</text>`;
    g+=`<rect x="${X}" y="${T}" width="${bw}" height="${H-B-T}" fill="transparent" data-tip="${x.d.getDate()} de ${MESES[x.d.getMonth()].toLowerCase()}\n${x.v?brl(x.v):'Nada'}"/>`});
  return `<svg viewBox="0 0 ${W} ${H}" style="min-width:0" role="img" aria-label="Gastos por dia">${g}</svg>`;
}
function histHtml(card,fsIn,titulo){
  let fs;if(fsIn)fs=fsIn;else if(card)fs=Object.values(S.faturas).filter(f=>f.card===card.id);
  else{const ids=new Set(cartoesLista().map(c=>c.id)),g={};Object.values(S.faturas).filter(f=>ids.has(f.card)).forEach(f=>{const k=f.ano*12+f.mes;(g[k]=g[k]||{ano:f.ano,mes:f.mes,tx:[]}).tx.push(...f.tx)});fs=Object.values(g)}
  fs=fs.sort((a,b)=>a.ano-b.ano||a.mes-b.mes).slice(-12);
  if(fs.length<2&&!fsIn) return fs.length?`<p class="small muted" style="margin-top:18px">O histórico por mês aparece quando houver faturas de 2 meses ou mais.</p>`:'';
  const tot={};fs.forEach(f=>f.tx.forEach(t=>{if(t.v>0)tot[t.cat]=(tot[t.cat]||0)+t.v}));
  const top=Object.keys(tot).sort((a,b)=>tot[b]-tot[a]).slice(0,7),cor=catCores(top);
  const rows=fs.map(f=>{const r={t:0,Outras:0};top.forEach(c=>r[c]=0);f.tx.forEach(t=>{if(t.v<=0)return;r.t+=t.v;if(top.includes(t.cat))r[t.cat]+=t.v;else r.Outras+=t.v});return r});
  const keys=[...top,'Outras'],col=c=>c==='Outras'?'var(--none)':cor[c];
  const W=680,H=250,L=44,T=24,B=30,n=fs.length,bw=(W-L-12)/n,max=niceMax(Math.max(1,...rows.map(r=>r.t)));
  let g=axis(W,H,L,T,B,max,4);
  rows.forEach((r,j)=>{const x=L+j*bw+bw*.18,w=bw*.64;let y=H-B;const segs=keys.filter(c=>r[c]>0);
    segs.forEach((c,si)=>{const h=(H-B-T)*r[c]/max,gap=si?2:0;y-=h;g+=`<rect x="${x}" y="${y+gap}" width="${w}" height="${Math.max(0,h-gap)}" rx="${si===segs.length-1?3:0}" fill="${col(c)}"/>`});
    g+=`<text x="${x+w/2}" y="${H-B+14}" text-anchor="middle">${MES3[fs[j].mes]}/${String(fs[j].ano).slice(2)}</text>${r.t?`<text class="v" x="${x+w/2}" y="${y-5}" text-anchor="middle">${k(r.t)}</text>`:''}`;
    g+=`<rect x="${L+j*bw}" y="${T}" width="${bw}" height="${H-B-T}" fill="transparent" data-tip="${esc([`Fatura de ${MESES[fs[j].mes].toLowerCase()}/${fs[j].ano}`,...segs.map(c=>`${c}: ${brl(r[c])}`),`Total: ${brl(r.t)}`].join('\n'))}"/>`});
  return `<div class="section" style="margin-top:22px"><h2 class="h3">${titulo||(card?'Faturas':'Todos os cartões')+' mês a mês, por categoria'}</h2><div class="chart">
    <div class="legend" style="margin-bottom:8px">${keys.filter(c=>rows.some(r=>r[c]>0)).map(c=>`<span><i class="dot" style="background:${col(c)}"></i>${c}</span>`).join('')}</div>
    <svg viewBox="0 0 ${W} ${H}" style="min-width:0" role="img" aria-label="Faturas por mês">${g}</svg></div></div>`;
}

async function exportar(){
  const d=new Date(),stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const txt=JSON.stringify({app:'contas-da-casa',formato:1,exportadoEm:d.toISOString(),anos:S.anos,reserva:S.reserva,rendas:S.rendas,fontesRenda:S.fontes,faturas:S.faturas,regrasCartao:S.cartCfg},null,1);
  S.bkText='';S.bkErr=false;
  let dl=null;try{dl=await window.claude.use('downloads')}catch(e){}
  if(dl){try{await dl.save({filename:`contas-da-casa-${stamp}.json`,data:txt});S.bkMsg='Backup salvo.'}
    catch(e){if(e&&e.code==='declined'){S.bkMsg='Download cancelado.'}else{S.bkText=txt;S.bkMsg='O download não está disponível aqui. Copie o texto abaixo e salve num arquivo .json.'}}}
  else{S.bkText=txt;S.bkMsg='O download não está disponível aqui. Copie o texto abaixo e salve num arquivo .json.'}
  render();
}
function lerBackup(file){
  const rd=new FileReader();
  rd.onload=()=>{try{
      const o=JSON.parse(rd.result);
      if(!o||typeof o!=='object'||!o.anos||typeof o.anos!=='object') throw 0;
      const anos=Object.keys(o.anos).filter(a=>/^\d{4}$/.test(a)&&Array.isArray(o.anos[a].itens)).map(Number).sort((a,b)=>a-b);
      if(!anos.length) throw 0;
      S.imp={data:o,anos,temReserva:!!o.reserva,quando:o.exportadoEm?new Date(o.exportadoEm).toLocaleDateString('pt-BR'):'data desconhecida'};S.bkMsg='';S.bkErr=false;
    }catch(e){S.imp=null;S.bkErr=true;S.bkMsg='Esse arquivo não é um backup do Contas da Casa. Escolha o .json que você exportou daqui.'}
    render()};
  rd.onerror=()=>{S.bkErr=true;S.bkMsg='Não consegui ler o arquivo. Tente de novo.';render()};
  rd.readAsText(file);
}
async function importar(){
  const im=S.imp;if(!im||!S.db)return;
  const novos={};im.anos.forEach(a=>{const d=im.data.anos[a];novos[a]={ano:a,notas:String(d.notas||''),itens:d.itens.map(i=>({id:String(i.id||a+'-'+uid()),dia:i.dia==null?null:+i.dia,nome:String(i.nome||''),valor:+i.valor||0,tipo:i.tipo==='Empresa'?'Empresa':'PF',conta:['B','N','M'].includes(i.conta)?i.conta:'',meses:Array.from({length:12},(_,m)=>(i.meses&&i.meses[m])||null)}))}});
  const remover=Object.keys(S.anos).filter(a=>!novos[a]);
  S.imp=null;setSync('Importando…');
  try{
    for(const a of remover){await S.db.doc('anos/'+a).delete();delete S.anos[a]}
    Object.keys(novos).forEach(a=>{S.anos[a]=novos[a];saveAno(a)});
    if(im.data.reserva){S.reserva=im.data.reserva;saveReserva()}
    if(im.data.faturas&&typeof im.data.faturas==='object'){for(const k of Object.keys(S.faturas).filter(k=>!im.data.faturas[k])){await S.db.doc('faturas/'+k).delete();delete S.faturas[k]}
      Object.keys(im.data.faturas).filter(k=>/^[a-z0-9-]+_\d{4}-\d{2}$/.test(k)).forEach(k=>{S.faturas[k]=im.data.faturas[k];saveFat(k)})}
    if(im.data.regrasCartao){S.cartCfg={regras:Object.assign({},im.data.regrasCartao.regras)};saveCartCfg()}
    if(Array.isArray(im.data.fontesRenda)){S.fontes=im.data.fontesRenda.map(f=>Object.assign({id:String(f.id),nome:String(f.nome||''),cor:+f.cor||0,ativa:f.ativa!==false},f.tipo==='diaria'?{tipo:'diaria',meta:+f.meta||0,metas:f.metas||{}}:{}));saveFontes()}
    if(im.data.rendas&&typeof im.data.rendas==='object'){for(const a of Object.keys(S.rendas).filter(a=>!im.data.rendas[a])){await S.db.doc('rendas/'+a).delete();delete S.rendas[a]}
      Object.keys(im.data.rendas).filter(a=>/^\d{4}$/.test(a)).forEach(a=>{const x=im.data.rendas[a];S.rendas[a]={ano:+a,entradas:(x.entradas||[]).map(e=>({id:String(e.id||'e'+uid()),f:String(e.f),m:+e.m,d:+e.d,v:+e.v||0}))};saveRenda(a)})}
    S.bkErr=false;S.bkMsg=`Backup importado: ${im.anos.length} anos.`;
  }catch(e){S.bkErr=true;S.bkMsg='A importação parou no meio. Tente importar o arquivo de novo.'}
  render();
}

      if(S.fixMeses===i.id&&f==='valor')render();return}
    render();return}
  if(a==='fx-cartao'){const i=findItem(S.fixAno,t.dataset.id);
    if(t.checked){i.cartao=true;if(!i.cartaoId){const ex=cartoesLista().find(c=>slugC(c.nome)===slugC(i.nome));i.cartaoId=ex?ex.id:slugC(i.nome)}}else{delete i.cartao}
    saveAno(S.fixAno);render();return}
  if(a==='cat-ren'){const old=t.dataset.v,nu=t.value.trim();if(!nu||nu===old){t.value=old;return}
    if(catsList().some(c=>c.toLowerCase()===nu.toLowerCase())){S.catErr=`Já existe a categoria "${nu}".`;render();return}
    catMudar(old,nu);S.catErr='';S.fatMsg=`"${old}" agora se chama "${nu}".`;render();return}
  if(a==='tx-cat'){const F=fatAtual();if(!F)return;const tx=F.tx.find(x=>x.id===t.dataset.id);if(!tx)return;
    const mk=merchKey(tx.desc),cat=t.value;S.cartCfg.regras=Object.assign({},S.cartCfg.regras,{[mk]:cat});
    let n=0;Object.values(S.faturas).forEach(f=>{let ch=false;f.tx.forEach(x=>{if(merchKey(x.desc)===mk&&x.cat!==cat){x.cat=cat;ch=true;n++}});if(ch)saveFat(fatId(f.card,f.ano,f.mes))});
    saveCartCfg();S.fatMsg=`"${prettyMerch(mk)}" agora é ${cat}${n>1?` (${n} lançamentos atualizados)`:''}. Próximas faturas também.`;render();return}
  if(a==='fxm'){const i=findItem(S.fixAno,t.dataset.id),m=+t.dataset.m,raw=t.value.trim(),v=parseFloat(raw),pad=+i.valor||0;
    if(raw===''||!(v>=0)||Math.round(v*100)/100===pad)setEntry(i,m,{v:null});else setEntry(i,m,{v:Math.round(v*100)/100});
    saveAno(S.fixAno);render();const nx=document.getElementById(`fxm-${i.id}-${m+1}`);if(nx)nx.focus();return}
  if(a==='vmes'){const i=findItem(S.ano,t.dataset.id),v=parseFloat(t.value);if(!(v>=0))return;
    setEntry(i,S.mes,{v:Math.round(v*100)/100===(+i.valor||0)?null:Math.round(v*100)/100});saveAno(S.ano);render();return}
  if(a==='nota'){const i=findItem(S.ano,t.dataset.id);setEntry(i,S.mes,{t:t.value.trim()});saveAno(S.ano);render();return}
  if(a==='notas'){S.anos[S.fixAno].notas=t.value;saveAno(S.fixAno);return}
  if(a==='rs'){S.reserva[t.dataset.f]=parseFloat(t.value)||0;saveReserva();render();return}
  if(a==='rg'){const g=S.reserva.registros[+t.dataset.k];g[t.dataset.f]=t.dataset.f==='valor'?(parseFloat(t.value)||0):t.value;saveReserva();return}
});
app.addEventListener('input',e=>{const t=e.target;if(t.dataset.act!=='txq')return;S.txQ=t.value;
  const F=fatAtual(),box=document.getElementById('txbox');if(F&&box)box.innerHTML=txListHtml(F)});
app.addEventListener('submit',e=>{
  const f=e.target;
  if(f.id==='resform'){e.preventDefault();const r=S.reserva;r.meses=r.meses||{};
    r.meses[f.dataset.key]={inicio:parseFloat(document.getElementById('re-ini').value)||0,fim:parseFloat(document.getElementById('re-fim').value)||0};
    S.resEdit=false;saveReserva();render();return}
  if(f.classList.contains('txobsf')){e.preventDefault();setObs(f.dataset.id,f.querySelector('input').value);return}
  if(f.id==='cat-add'){e.preventDefault();const nu=document.getElementById('cat-nova').value.trim();
    if(!nu){S.catErr='Escreva o nome da categoria.';render();return}
    if(catsList().some(c=>c.toLowerCase()===nu.toLowerCase())){S.catErr=`Já existe a categoria "${nu}".`;render();return}
    const cl=catsList();cl.splice(Math.max(0,cl.indexOf('Outros')),0,nu);S.cartCfg.cats=cl;if(S.cartCfg.ren&&S.cartCfg.ren[nu]){const rn=Object.assign({},S.cartCfg.ren);delete rn[nu];S.cartCfg.ren=rn}
    S.catErr='';saveCartCfg();S.fatMsg=`Categoria "${nu}" criada. Escolha ela nos lançamentos.`;render();const n=document.getElementById('cat-nova');if(n)n.focus();return}
  if(f.id==='nfonte'){e.preventDefault();const nome=document.getElementById('nfonte-nome').value.trim(),err=document.getElementById('nfonte-err');
    if(!nome){err.textContent='Escreva o nome da fonte.';err.hidden=false;return}
    if(S.fontes.some(x=>x.nome.toLowerCase()===nome.toLowerCase())){err.textContent='Já existe uma fonte com esse nome.';err.hidden=false;return}
    const usadas=new Set(S.fontes.map(x=>(+x.cor||0)%8));let cor=0;while(usadas.has(cor)&&cor<8)cor++;if(cor>=8)cor=S.fontes.length%8;
    const diaria=document.getElementById('nfonte-diaria').checked,meta=parseFloat(document.getElementById('nfonte-meta').value)||0;
    S.fontes.push(Object.assign({id:'f'+uid(),nome,cor,ativa:true},diaria?{tipo:'diaria',meta}:{}));S.addFonte=false;saveFontes();render();return}
  if(f.classList.contains('addent')){e.preventDefault();const fid=f.dataset.f,ano=S.ano,mes=S.mes;
    const d=parseInt(f.elements.dia.value,10),v=parseFloat(String(f.elements.valor.value).replace(',','.'));
    if(!(d>=1&&d<=diasNoMes(ano,mes))){f.elements.dia.focus();f.elements.dia.select();return}
    if(!(v>0)){f.elements.valor.focus();return}
    if(!S.rendas[ano])S.rendas[ano]={ano,entradas:[]};
    S.rendas[ano].entradas.push({id:'e'+uid(),f:fid,m:mes,d,v:Math.round(v*100)/100});saveRenda(ano);render();
    const nv=document.getElementById('av-'+fid);if(nv)nv.focus();return}
  if(f.id!=='nf') return; e.preventDefault();
  const ano=+f.dataset.ano, nome=f.elements['nf-nome'].value.trim(), dia=parseInt(f.elements['nf-dia'].value,10);
  const valor=parseFloat(String(f.elements['nf-valor'].value).replace(',','.')), mi=+f.elements['nf-mes'].value;
  const conta=(f.querySelector('input[name=nf-conta]:checked')||{}).value||'';
  const err=document.getElementById('nf-err');
  const fail=(msg,id)=>{err.textContent=msg;err.hidden=false;const el=document.getElementById(id);if(el)el.focus()};
  if(!nome) return fail('Escreva o nome da conta.','nf-nome');
  if(!(dia>=1&&dia<=31)) return fail('Informe o dia do vencimento, de 1 a 31.','nf-dia');
  if(!(valor>0)) return fail('Informe o valor da conta.','nf-valor');
  const it={id:ano+'-'+uid(),dia,nome,valor:Math.round(valor*100)/100,tipo:'PF',conta,meses:Array.from({length:12},(_,k)=>k<mi?{s:'n'}:null)};
  S.anos[ano].itens.push(it); saveAno(ano); S.adding=false; render();
  const li=document.getElementById('bill-'+it.id); if(li) li.scrollIntoView({block:'center',behavior:'smooth'});
});
document.addEventListener('click',e=>{
  let ch=false;
  if(S.delEnt&&!e.target.closest('[data-act=ent-del]')){S.delEnt=null;ch=true}
  if(S.pick&&!e.target.closest('.picker,.check')){S.pick=null;ch=true}
  if(S.navPick&&!e.target.closest('.navpick,.navbtn')){S.navPick=null;ch=true}
  if(ch)render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.pick||S.adding||S.resEdit||S.navPick||S.fixOpen)){const fo=S.fixOpen;S.pick=null;S.adding=false;S.resEdit=false;S.navPick=null;S.fixOpen=null;S.fixMeses=null;render();if(fo){const t=document.getElementById('fxt-'+fo);if(t)t.focus()}}});
const hdrEl=document.querySelector('header.top');
function setHdr(){if(hdrEl)document.documentElement.style.setProperty('--hdr',hdrEl.offsetHeight+'px')}
setHdr();window.addEventListener('resize',setHdr);
window.addEventListener('scroll',()=>{const w=document.querySelector('.mbwrap');if(w){const t=w.getBoundingClientRect().top,lim=(hdrEl?hdrEl.getBoundingClientRect().bottom:0)+1;w.classList.toggle('stuck',window.scrollY>40&&t<=lim)}},{passive:true});
const tipEl=document.getElementById('tip');
function showTip(e){const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tipEl.hidden=true;return}
  tipEl.textContent=t.dataset.tip;tipEl.hidden=false;const w=tipEl.offsetWidth,h=tipEl.offsetHeight;
  let x=e.clientX+12,y=e.clientY-h-12;if(x+w>innerWidth-8)x=e.clientX-w-12;if(x<8)x=8;if(y<8)y=e.clientY+16;
  tipEl.style.left=x+'px';tipEl.style.top=y+'px'}
document.addEventListener('pointermove',showTip);document.addEventListener('pointerdown',showTip);
document.addEventListener('scroll',()=>{tipEl.hidden=true},{passive:true});
window.addEventListener('hashchange',()=>{S.obsEdit=null;S.fatPaste=false;S.fatPrev=null;S.fatMsg='';S.fatDel=false;S.open=null;S.confirmDel=null;S.fixOpen=null;S.fixMeses=null;S.pick=null;S.adding=false;S.resEdit=false;S.imp=null;S.bkText='';S.bkMsg='';S.fonteEdit=null;S.addFonte=false;S.delEnt=null;S.rimp=null;S.dimp=null;S.rimpMsg='';S.rimpWarn='';tipEl.hidden=true;render();window.scrollTo(0,0)});

/* ---------- boot ---------- */
render();
(async()=>{
  for(let k=0;k<30&&!(window.claude&&window.claude.use);k++) await new Promise(r=>setTimeout(r,100));
  const db=window.claude&&window.claude.use?await window.claude.use('db'):null;
  if(!db){setSync('Sem conexão');app.innerHTML='<div class="empty"><h2>Não consegui abrir seus dados</h2><p class="muted">Abra esta página no Claude, com sua conta conectada, para ver e salvar as contas.</p></div>';return}
  S.db=db;
  let gotAnos=false,gotRes=false;
  const ready=()=>{if(gotAnos&&gotRes&&!S.loaded){S.loaded=true;
    if(!Object.keys(S.anos).length){app.innerHTML='<div class="empty"><h2>Nenhuma conta cadastrada ainda</h2><p class="muted">Peça ao Claude para importar sua planilha, ou crie o primeiro ano abaixo.</p><button class="btn" id="novo">Começar '+now.getFullYear()+'</button></div>';
      document.getElementById('novo').onclick=()=>{const y=now.getFullYear();S.anos[y]={ano:y,notas:'',itens:[]};saveAno(y);location.hash='fixas';render()};S.loaded=false;return}
    setSync('Salvo');render()}};
  db.collection('anos').onSnapshot(snap=>{
    snap.docs.forEach(d=>{const p=pending['anos/'+d.id];if(p&&(p.busy||p.dirty))return;
      S.anos[d.id]=JSON.parse(JSON.stringify(d.data()));});
    gotAnos=true;
    if(S.loaded){const ae=document.activeElement;if(!(ae&&ae.matches('input,textarea,select')))render()}else ready();
  },()=>{setSync('Sem conexão')});
  const reRender=()=>{if(S.loaded){const ae=document.activeElement;if(!(ae&&ae.matches('input,textarea,select')))render()}};
  db.collection('rendas').onSnapshot(snap=>{
    snap.docs.forEach(d=>{const p=pending['rendas/'+d.id];if(p&&(p.busy||p.dirty))return;S.rendas[d.id]=JSON.parse(JSON.stringify(d.data()))});reRender();
  },()=>{});
  db.collection('faturas').onSnapshot(snap=>{const seen=new Set();snap.docs.forEach(d=>{seen.add(d.id);const p=pending['faturas/'+d.id];if(p&&(p.busy||p.dirty))return;S.faturas[d.id]=JSON.parse(JSON.stringify(d.data()))});
    Object.keys(S.faturas).forEach(k=>{const p=pending['faturas/'+k];if(!seen.has(k)&&!(p&&(p.busy||p.dirty)))delete S.faturas[k]});reRender()},()=>{});
  db.doc('config/cartoes').onSnapshot(d=>{const p=pending['config/cartoes'];if(p&&(p.busy||p.dirty))return;S.cartCfg=d.exists?JSON.parse(JSON.stringify(d.data())):{regras:{}};reRender()},()=>{});
  db.doc('config/rendas').onSnapshot(d=>{const p=pending['config/rendas'];if(p&&(p.busy||p.dirty))return;
    S.fontes=d.exists?JSON.parse(JSON.stringify(d.data().fontes||[])):[];reRender();
  },()=>{});
  db.doc('config/reserva').onSnapshot(d=>{
    const p=pending['config/reserva'];
    if(!(p&&(p.busy||p.dirty))) S.reserva=d.exists?JSON.parse(JSON.stringify(d.data())):{saldo:0,meta:0,aporte:0,registros:[]};
    gotRes=true;
    if(S.loaded){const ae=document.activeElement;if(!(ae&&ae.matches('input,textarea,select')))render()}else ready();
  },()=>{setSync('Sem conexão')});
})();
</script>
